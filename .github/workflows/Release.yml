name: Release (Publish + Docs)

on:
  push:
    tags:
      - '*'

# GITHUB_TOKEN needs write access to releases and gh-pages
permissions:
  contents: write

jobs:
  publish:
    name: publish
    runs-on: ${{ matrix.os[0] }}
    strategy:
      matrix:
        os: [
          [macos-latest, arm64, bash],
          [macos-15-intel, x86_64, bash],
          [ubuntu-latest, x86_64, bash],
          [ubuntu-24.04-arm, arm64, bash]
        ]
      fail-fast: false
    defaults:
      run:
        shell: ${{ matrix.os[2] }} {0}
    steps:
      - uses: actions/checkout@v4
        with:
          submodules: 'true'

      - name: Setup PSPDEV Environment
        run: |
          .github/scripts/setup_pspdev.sh "${{ matrix.os[0] }}" "${{ matrix.os[1] }}"

      - name: Build project
        run: make

      - name: Generate release files
        run: make release

      - name: Compress release
        id: compress
        run: |
          TAG_NAME="${GITHUB_REF##*/}"
          OS_NAME="${{ matrix.os[0] }}"
          ARCH_NAME="${{ matrix.os[1] }}"
          RELEASE_NAME="oslib-${TAG_NAME}-${OS_NAME}-${ARCH_NAME}"
          tar -czf "${RELEASE_NAME}.tar.gz" -C dist .
          echo "file=${RELEASE_NAME}.tar.gz" >> $GITHUB_OUTPUT

      - name: Publish release on GitHub Releases
        uses: softprops/action-gh-release@v1
        with:
          files: ${{ steps.compress.outputs.file }}
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}

  publish-docs:
    name: publish-docs
    runs-on: ubuntu-latest
    needs: publish
    steps:
      - uses: actions/checkout@v4
        with:
          submodules: 'true'

      - name: Setup PSPDEV Environment
        run: |
          .github/scripts/setup_pspdev.sh ubuntu-latest x86_64

      - name: Install doxygen
        run: sudo apt-get update && sudo apt-get install -y doxygen

      - name: Generate documentation
        run: make gendoc

      - name: Publish to GitHub Pages
        run: make ghpages
        env:
          GIT_AUTHOR_NAME: github-actions
          GIT_AUTHOR_EMAIL: github-actions@github.com
          GIT_COMMITTER_NAME: github-actions
          GIT_COMMITTER_EMAIL: github-actions@github.com
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
