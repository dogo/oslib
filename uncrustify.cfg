#
# OSLib code style — Uncrustify configuration
#
# Derived from the style already used in src/ and samples/:
#   K&R braces, hard tabs (width 8), "if (" with a space, "foo()" without,
#   pointer star bound to the name ("char *p"), casts without a trailing space.
#
# Only options that actually encode the project style are listed here; every
# other option keeps its Uncrustify default. Do not paste a full
# `uncrustify --show-config` dump over this file — it would silently reset
# every rule below to "ignore".
#
# Tested with Uncrustify 0.83.
#

#
# General
#

newlines                        = lf       # LF everywhere, see .gitattributes
input_tab_size                  = 8
output_tab_size                 = 8
utf8_bom                        = remove

#
# Indentation
#

indent_columns                  = 8
indent_with_tabs                = 1        # tabs to indent, spaces to align
indent_cmt_with_tabs            = false
indent_switch_case              = 0        # "case" sits at the "switch" level
indent_label                    = 1
indent_class                    = true
indent_func_call_param          = false
indent_paren_open_brace         = false
indent_align_assign             = true
indent_braces                   = false
indent_col1_comment             = true
indent_access_spec              = 1

#
# Spacing — statements
#

sp_before_sparen                = force    # if (x), while (x), for (;;)
sp_inside_sparen                = remove   # if (x), never if ( x )
sp_after_sparen                 = force    # if (x) {
sp_sparen_brace                 = force
sp_paren_brace                  = force
sp_do_brace_open                = force
sp_brace_close_while            = force
sp_while_paren_open             = force
sp_else_brace                   = force
sp_brace_else                   = force
sp_after_semi_for               = force
sp_after_semi_for_empty         = remove

#
# Spacing — functions
#

sp_func_call_paren              = remove   # foo(), never foo ()
sp_func_call_paren_empty        = remove
sp_func_def_paren               = remove
sp_func_proto_paren             = remove
sp_func_proto_paren_empty       = remove
sp_func_class_paren             = remove
sp_inside_fparen                = remove   # foo(a, b), never foo( a, b )
sp_inside_fparens               = remove
sp_fparen_brace                 = force
sp_after_comma                  = force
sp_before_comma                 = remove

#
# Spacing — operators
#

sp_assign                       = force
sp_arith                        = force
sp_bool                         = force
sp_compare                      = force
sp_cond_colon                   = force
sp_cond_question                = force
sp_before_semi                  = remove
sp_after_semi                   = add
sp_before_square                = remove   # a[i]
sp_inside_square                = remove
sp_after_cast                   = remove   # (int)x, never (int) x
sp_inside_paren_cast            = remove
sp_sizeof_paren                 = remove
sp_not                          = remove   # !x
sp_inv                          = remove   # ~x
sp_addr                         = remove   # &x
sp_deref                        = remove   # *x
sp_sign                         = remove   # -x
sp_incdec                       = remove   # x++

#
# Spacing — pointers and types
#

sp_before_ptr_star              = force    # char *p
sp_before_unnamed_ptr_star      = force
sp_between_ptr_star             = remove   # char **p
sp_after_ptr_star               = remove
sp_after_ptr_star_func          = remove
sp_before_ptr_star_func         = force

#
# Spacing — braces and comments
#

sp_inside_braces                = force    # { 1, 2 }
sp_inside_braces_struct         = force
sp_inside_braces_enum           = force
sp_before_nl_cont               = add
sp_cmt_cpp_start                = add      # // comment

#
# Newlines / brace placement (K&R)
#

nl_fdef_brace                   = remove   # int foo(void) {
nl_func_type_name               = remove
nl_if_brace                     = remove
nl_brace_else                   = remove   # } else {
nl_elseif_brace                 = remove
nl_else_brace                   = remove
nl_else_if                      = remove   # } else if (...)
nl_for_brace                    = remove
nl_while_brace                  = remove
nl_do_brace                     = remove
nl_brace_while                  = remove   # } while (x);
nl_switch_brace                 = remove
nl_enum_brace                   = remove
nl_struct_brace                 = remove
nl_union_brace                  = remove
nl_before_if_closing_paren      = remove
nl_multi_line_cond              = false
nl_after_brace_open             = false

nl_end_of_file                  = force    # exactly one trailing newline
nl_end_of_file_min              = 1
nl_max                          = 3        # at most 2 consecutive blank lines
nl_after_func_body              = 2
nl_after_func_proto_group       = 1
nl_before_block_comment         = 2

eat_blanks_after_open_brace     = true
eat_blanks_before_close_brace   = true

#
# Preprocessor
#

pp_indent                       = remove   # #define at column 1
pp_indent_at_level              = false
pp_space_after                  = remove
pp_if_indent_code               = false

#
# Line width — reporting only, never wrap automatically
#

code_width                      = 0
